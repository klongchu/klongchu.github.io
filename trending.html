<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Trending - klongchu</title>
  <style>
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --surface-4: #1E2636;
      --accent: #38BDF8;
      --accent-dim: #1E3A8A;
      --text: #E5E7EB;
      --text-dim: #9CA3AF;
      --radius: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--surface-0);
      color: var(--text);
      line-height: 1.6;
    }
    nav {
      background: var(--surface-1);
      padding: clamp(1rem, 3vw, 1.5rem);
      border-bottom: 1px solid var(--surface-3);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav h1 {
      font-size: clamp(1.25rem, 4vw, 1.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    nav h1 a {
      color: var(--text);
      text-decoration: none;
    }
    nav ul {
      display: flex;
      gap: clamp(1rem, 3vw, 2rem);
      list-style: none;
    }
    nav a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: clamp(0.875rem, 2vw, 1rem);
      transition: color 0.2s;
    }
    nav a:hover {
      color: var(--accent);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 4rem) clamp(1rem, 3vw, 2rem);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    h2 {
      font-size: clamp(2rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .date {
      color: var(--text-dim);
      font-size: clamp(0.875rem, 2vw, 1rem);
    }
    .repo {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius);
      padding: clamp(1.25rem, 3vw, 1.75rem);
      margin-bottom: clamp(1rem, 2vw, 1.5rem);
      transition: transform 0.2s, border-color 0.2s;
    }
    .repo:hover {
      transform: translateY(-2px);
      border-color: var(--accent-dim);
    }
    .repo-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 1rem;
    }
    .repo h3 {
      font-size: clamp(1.1rem, 2.5vw, 1.25rem);
      color: var(--accent);
      margin: 0;
    }
    .repo h3 a {
      color: var(--accent);
      text-decoration: none;
    }
    .repo h3 a:hover {
      text-decoration: underline;
    }
    .rank {
      background: var(--surface-3);
      color: var(--text-dim);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: clamp(0.875rem, 2vw, 0.95rem);
      font-weight: 600;
      white-space: nowrap;
    }
    .desc {
      color: var(--text-dim);
      font-size: clamp(0.9rem, 2vw, 1rem);
      line-height: 1.6;
      margin-bottom: 0.75rem;
    }
    .stats {
      display: flex;
      gap: clamp(1rem, 3vw, 1.5rem);
      font-size: clamp(0.875rem, 2vw, 0.95rem);
      color: var(--text-dim);
      flex-wrap: wrap;
    }
    .stats span {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .today {
      color: var(--accent);
      font-weight: 600;
    }
    footer {
      border-top: 1px solid var(--surface-3);
      background: var(--surface-1);
      padding: clamp(2rem, 4vw, 3rem);
      margin-top: clamp(4rem, 8vw, 6rem);
    }
    footer .container {
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      color: var(--text-dim);
      font-size: clamp(0.875rem, 2vw, 1rem);
    }
  </style>
</head>
<body>
  <nav>
    <div class="container">
      <h1><a href="/">klongchu</a></h1>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/blog.html">Blog</a></li>
        <li><a href="/trending.html">Trending</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="header">
      <h2>🔥 GitHub Trending</h2>
      <div class="date" id="update-date">Loading...</div>
    </div>
    
    <div id="repos"></div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 klongchu • อัปเดตทุกวันโดย GitHub Actions</p>
    </div>
  </footer>

  <script>
    fetch('trending.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('update-date').textContent = `อัปเดต: ${data.date}`;
        
        const container = document.getElementById('repos');
        data.trending_repos.forEach(repo => {
          const div = document.createElement('div');
          div.className = 'repo';
          div.innerHTML = `
            <div class="repo-header">
              <h3><a href="${repo.url}" target="_blank">${repo.name}</a></h3>
              <span class="rank">#${repo.rank}</span>
            </div>
            ${repo.description ? `<div class="desc">${repo.description}</div>` : ''}
            <div class="stats">
              <span>⭐ ${repo.stars.toLocaleString()}</span>
              <span>🍴 ${repo.forks.toLocaleString()}</span>
              ${repo.stars_today ? `<span class="today">+${repo.stars_today.toLocaleString()} วันนี้</span>` : ''}
            </div>
          `;
          container.appendChild(div);
        });
      })
      .catch(err => {
        document.getElementById('repos').innerHTML = '<div style="text-align:center;padding:3rem;color:var(--text-dim)">ไม่สามารถโหลดข้อมูลได้</div>';
      });
  </script>
</body>
</html>
