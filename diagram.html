<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Trending System Diagram</title>
  <style>
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --accent: #38BDF8;
      --text: #E5E7EB;
      --text-dim: #9CA3AF;
      --green: #6EE7B7;
      --orange: #E9A568;
    }
    body {
      margin: 0;
      padding: 40px;
      background: var(--surface-0);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    svg {
      max-width: 1000px;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#38BDF8" />
      </marker>
    </defs>
    
    <!-- Title -->
    <text x="500" y="40" fill="#E5E7EB" font-size="28" font-weight="700" text-anchor="middle">GitHub Trending Tracker Architecture</text>
    
    <!-- Step 1: GitHub Trending -->
    <rect x="50" y="100" width="200" height="100" rx="12" fill="#0F131C" stroke="#38BDF8" stroke-width="2"/>
    <text x="150" y="140" fill="#38BDF8" font-size="18" font-weight="600" text-anchor="middle">github.com/trending</text>
    <text x="150" y="165" fill="#9CA3AF" font-size="14" text-anchor="middle">HTML page with</text>
    <text x="150" y="185" fill="#9CA3AF" font-size="14" text-anchor="middle">trending repos</text>
    
    <!-- Arrow 1 -->
    <line x1="250" y1="150" x2="330" y2="150" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="290" y="140" fill="#9CA3AF" font-size="12" text-anchor="middle">scrape</text>
    
    <!-- Step 2: Python Script -->
    <rect x="350" y="100" width="200" height="100" rx="12" fill="#0F131C" stroke="#6EE7B7" stroke-width="2"/>
    <text x="450" y="140" fill="#6EE7B7" font-size="18" font-weight="600" text-anchor="middle">fetch_trending.py</text>
    <text x="450" y="165" fill="#9CA3AF" font-size="14" text-anchor="middle">HTMLParser</text>
    <text x="450" y="185" fill="#9CA3AF" font-size="14" text-anchor="middle">+ urllib (stdlib)</text>
    
    <!-- Arrow 2 -->
    <line x1="450" y1="200" x2="450" y2="260" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="470" y="235" fill="#9CA3AF" font-size="12">write</text>
    
    <!-- Step 3: trending.json -->
    <rect x="350" y="280" width="200" height="80" rx="12" fill="#161D2B" stroke="#E9A568" stroke-width="2"/>
    <text x="450" y="315" fill="#E9A568" font-size="18" font-weight="600" text-anchor="middle">trending.json</text>
    <text x="450" y="340" fill="#9CA3AF" font-size="14" text-anchor="middle">{repos: [...], date: "..."}</text>
    
    <!-- Arrow 3 -->
    <line x1="550" y1="320" x2="630" y2="320" stroke="#E9A568" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="590" y="310" fill="#9CA3AF" font-size="12" text-anchor="middle">commit</text>
    
    <!-- Step 4: GitHub Actions -->
    <rect x="650" y="100" width="200" height="100" rx="12" fill="#0F131C" stroke="#38BDF8" stroke-width="2"/>
    <text x="750" y="135" fill="#38BDF8" font-size="18" font-weight="600" text-anchor="middle">GitHub Actions</text>
    <text x="750" y="160" fill="#9CA3AF" font-size="14" text-anchor="middle">Runs daily</text>
    <text x="750" y="180" fill="#9CA3AF" font-size="14" text-anchor="middle">00:30 UTC (cron)</text>
    
    <!-- Arrow 4 (Actions trigger script) -->
    <path d="M 750 200 Q 750 240 550 240 Q 550 200 550 200" stroke="#38BDF8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="650" y="255" fill="#9CA3AF" font-size="12" text-anchor="middle">triggers</text>
    
    <!-- Arrow 5 (commit to repo) -->
    <line x1="750" y1="280" x2="750" y2="360" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="770" y="325" fill="#9CA3AF" font-size="12">push</text>
    
    <!-- Step 5: GitHub Repo -->
    <rect x="650" y="380" width="200" height="80" rx="12" fill="#161D2B" stroke="#38BDF8" stroke-width="2"/>
    <text x="750" y="415" fill="#38BDF8" font-size="18" font-weight="600" text-anchor="middle">klongchu.github.io</text>
    <text x="750" y="440" fill="#9CA3AF" font-size="14" text-anchor="middle">Git repository</text>
    
    <!-- Arrow 6 -->
    <line x1="650" y1="420" x2="570" y2="420" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="610" y="410" fill="#9CA3AF" font-size="12" text-anchor="middle">deploy</text>
    
    <!-- Step 6: GitHub Pages -->
    <rect x="350" y="380" width="200" height="80" rx="12" fill="#0F131C" stroke="#6EE7B7" stroke-width="2"/>
    <text x="450" y="415" fill="#6EE7B7" font-size="18" font-weight="600" text-anchor="middle">GitHub Pages</text>
    <text x="450" y="440" fill="#9CA3AF" font-size="14" text-anchor="middle">Static hosting</text>
    
    <!-- Arrow 7 -->
    <line x1="350" y1="420" x2="270" y2="420" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="310" y="410" fill="#9CA3AF" font-size="12" text-anchor="middle">serve</text>
    
    <!-- Step 7: Browser -->
    <rect x="50" y="380" width="200" height="80" rx="12" fill="#161D2B" stroke="#E9A568" stroke-width="2"/>
    <text x="150" y="415" fill="#E9A568" font-size="18" font-weight="600" text-anchor="middle">Browser</text>
    <text x="150" y="440" fill="#9CA3AF" font-size="14" text-anchor="middle">trending.html + JS</text>
    
    <!-- Arrow 8 (fetch JSON) -->
    <path d="M 150 380 Q 150 320 350 320" stroke="#E9A568" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
    <text x="220" y="340" fill="#9CA3AF" font-size="12" text-anchor="middle">fetch JSON</text>
    
    <!-- Legend -->
    <rect x="50" y="550" width="900" height="130" rx="12" fill="#0F131C" stroke="#161D2B" stroke-width="2"/>
    <text x="70" y="580" fill="#E5E7EB" font-size="16" font-weight="600">ขั้นตอนการทำงาน:</text>
    
    <text x="70" y="610" fill="#38BDF8" font-size="14" font-weight="600">1.</text>
    <text x="90" y="610" fill="#9CA3AF" font-size="14">GitHub Actions รัน Python script ทุกวัน 00:30 UTC</text>
    
    <text x="70" y="635" fill="#38BDF8" font-size="14" font-weight="600">2.</text>
    <text x="90" y="635" fill="#9CA3AF" font-size="14">Script scrape github.com/trending ด้วย HTMLParser (stdlib only)</text>
    
    <text x="70" y="660" fill="#38BDF8" font-size="14" font-weight="600">3.</text>
    <text x="90" y="660" fill="#9CA3AF" font-size="14">เขียน trending.json → commit + push กลับ repo → GitHub Pages deploy อัตโนมัติ → Browser fetch + render</text>
  </svg>
</body>
</html>
