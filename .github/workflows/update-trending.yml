name: Update GitHub Trending

on:
  schedule:
    # Runs daily at 00:30 UTC (07:30 Bangkok time)
    - cron: '30 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch trending
        run: python scripts/fetch_trending.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet trending.json; then
            echo "No changes to trending data."
          else
            git add trending.json
            git commit -m "chore: update trending data $(date -u +%Y-%m-%d)"
            git push
          fi
